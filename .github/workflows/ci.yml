name: phase1-ci

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: make test
      - name: Sanitizer test
        run: make test-sanitize
      - name: Verifier fuzz smoke test
        run: make fuzz-smoke
